name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # The bundle-size check (scripts/size.mjs), once: sizes don't depend on Node's version.
      - run: npm run size
        if: matrix.node == 24
      # Installs the packed tarball in a new project and uses it as ES modules and as CommonJS, with types.
      - run: npm run pack-check

  visual:
    # Screenshots of the demo pages in Chromium, and the DOM checks beside them (axe among them) in
    # Chromium, Firefox and WebKit (playwright.config.ts). The job runs in the official Playwright
    # image, which comes with the three browsers and their fonts, so nothing is downloaded per run and
    # the pictures match baselines made locally with `npm run test:visual:update` in the same image.
    # The tag must match @playwright/test in package.json (Playwright says so if they differ).
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v7
      - run: npm ci
      - run: npm run test:visual
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: visual-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
