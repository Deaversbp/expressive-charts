name: Pages

# The demo site, https://deaversbp.github.io/expressive-charts/: every page in demo/, built by Vite
# (demo/vite.config.mjs). Pull requests build it, so a page that doesn't build is caught. main
# publishes it, once GitHub Pages is set to publish from GitHub Actions (Settings → Pages → Source).
# Until then (a private repository on a free plan can't have Pages at all), the site is built and
# nothing is deployed or fails. Run it from the Actions tab to publish main without a new push.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time, the newest last; a pull request's newer push replaces its older run.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # To read whether Pages publishes from GitHub Actions.
      pages: read
    outputs:
      deploy: ${{ steps.pages.outputs.deploy }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:site
      - name: Check Pages publishes from GitHub Actions
        id: pages
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .build_type 2>/dev/null)" = workflow ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::GitHub Pages doesn't publish from GitHub Actions yet (Settings → Pages → Source), so the site was built and not deployed."
          fi
      - uses: actions/upload-pages-artifact@v5
        if: steps.pages.outputs.deploy == 'true'
        with:
          path: site

  deploy:
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
