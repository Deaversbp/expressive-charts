<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quick start · expressive-charts</title>
<style>
  /* The demo pages' card, so the pictures match. The chart's --ec-* tokens come from the library's stylesheet. */
  :root { --page: #f6f6f3; --surface: #fcfcfb; --ink: #0b0b0b; --ring: rgba(11,11,11,0.10); }
  @media (prefers-color-scheme: dark) {
    :root { --page: #0f0f0e; --surface: #1a1a19; --ink: #f0efec; --ring: rgba(255,255,255,0.10); color-scheme: dark; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 20px; margin: 0; }
  .card { background: var(--surface); border: 1px solid var(--ring); border-radius: 12px; padding: 20px; display: grid; gap: 12px; min-width: 0; }
  #sales { min-width: 0; }
</style>
</head>
<body>
<main class="wrap">
  <section class="card" aria-labelledby="sales-title">
    <h1 id="sales-title">Revenue by region</h1>
    <div id="sales"></div>
  </section>
</main>
<script type="module" src="./quick-start.ts"></script>
</body>
</html>
